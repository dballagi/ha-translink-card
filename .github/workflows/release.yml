name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example, 0.1.0)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare version files
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python .github/scripts/set_version.py "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Validate backend
        run: |
          ruff check .
          pytest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm test
          npm run build

      - name: Verify committed bundle
        run: |
          git diff --exit-code -- \
            custom_components/translink_schedule/frontend/translink-schedule-card.js

      - name: Ensure tag does not exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Commit version files
        id: release_commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git diff --quiet -- \
            custom_components/translink_schedule/manifest.json \
            frontend/package.json \
            frontend/package-lock.json \
            pyproject.toml; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              custom_components/translink_schedule/manifest.json \
              frontend/package.json \
              frontend/package-lock.json \
              pyproject.toml
            git commit \
              -m "chore: prepare ${VERSION} release" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          else
            echo "Version files are already set to ${VERSION}."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.release_commit.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$TAG"
            --target "$TARGET"
            --title "$TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
