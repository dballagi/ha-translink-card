name: Update release badge

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: update-release-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Update badge
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/update_release_badge.py "$RELEASE_TAG"
      - name: Commit badge
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- docs/badges/releases.svg; then
            echo "Release badge is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/releases.svg
          git commit \
            -m "docs: update release badge to ${RELEASE_TAG}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
