[project]
name = "ha-translink-card"
version = "1.1.3"
requires-python = ">=3.12"
dependencies = [
  "gtfs-realtime-bindings>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "homeassistant>=2025.1.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
